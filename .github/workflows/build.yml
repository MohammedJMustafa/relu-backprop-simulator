# Builds a self-contained executable of the simulator for every platform,
# checks each one, and publishes them as a GitHub release when a tag v* is pushed.
#
#   Windows x64      ReLU-Backprop-Simulator-windows-x64.exe   (one file)
#   Linux x64/arm64  ReLU-Backprop-Simulator-linux-*           (one file)
#   macOS arm64/x64  ReLU-Backprop-Simulator-macos-*.zip       (an .app bundle)

name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: ReLU-Backprop-Simulator
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-22.04          # older glibc: the binary runs on more distributions
          - target: linux-arm64
            os: ubuntu-24.04-arm      # PySide6 for arm64 Linux needs glibc 2.39
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Check the homework answers and the interface (from source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --self-test --gui

      - name: Build with PyInstaller
        shell: bash
        run: |
          common=(--noconfirm --clean --name "$APP_NAME"
                  --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2
                  --exclude-module tkinter --exclude-module IPython)
          case "$RUNNER_OS" in
            Windows)
              python -m PyInstaller "${common[@]}" --onefile --windowed --icon relu_sim/assets/app.ico main.py ;;
            macOS)
              python -m PyInstaller "${common[@]}" --onedir --windowed --icon relu_sim/assets/app.png \
                --osx-bundle-identifier io.github.mohammedjmustafa.relubackpropsimulator main.py ;;
            Linux)
              python -m PyInstaller "${common[@]}" --onefile main.py ;;
          esac

      - name: Smoke-test the executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          RELU_SIM_SELFTEST_LOG: ${{ runner.temp }}\selftest.txt
        run: |
          $process = Start-Process -FilePath "dist\$env:APP_NAME.exe" -ArgumentList "--self-test", "--gui" -Wait -PassThru
          Get-Content $env:RELU_SIM_SELFTEST_LOG
          exit $process.ExitCode

      - name: Smoke-test the executable (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" --self-test --gui'

      - name: Smoke-test the executable (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/$APP_NAME" --self-test --gui'

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) cp "dist/$APP_NAME.exe" "release/$APP_NAME-${{ matrix.target }}.exe" ;;
            Linux)   cp "dist/$APP_NAME" "release/$APP_NAME-${{ matrix.target }}"
                     chmod +x "release/$APP_NAME-${{ matrix.target }}" ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" \
                       "release/$APP_NAME-${{ matrix.target }}.zip" ;;
          esac
          ls -la release

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all executables
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          cat > notes.md <<'EOF'
          Interactive simulation of **Homework 1: Gradient Descent with the ReLU Activation Function** - Mohammed Jalal Mustafa, Group A.

          Every file is self-contained: no Python or other installation is needed.

          | Platform | Download | How to start |
          |---|---|---|
          | Windows 10/11 (x64) | `ReLU-Backprop-Simulator-windows-x64.exe` | double-click (first start takes a few seconds) |
          | macOS 13+ Apple Silicon | `ReLU-Backprop-Simulator-macos-arm64.zip` | unzip, then right-click the app > Open |
          | macOS 13+ Intel | `ReLU-Backprop-Simulator-macos-x64.zip` | unzip, then right-click the app > Open |
          | Linux x64 (glibc 2.35+) | `ReLU-Backprop-Simulator-linux-x64` | `chmod +x` the file, then run it |
          | Linux arm64 (glibc 2.39+) | `ReLU-Backprop-Simulator-linux-arm64` | `chmod +x` the file, then run it |

          Each build was checked on its platform with `--self-test --gui`: all 40 values printed in the homework are reproduced, and the whole interface is exercised off-screen.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ReLU Backprop Simulator $GITHUB_REF_NAME" \
            --notes-file notes.md
